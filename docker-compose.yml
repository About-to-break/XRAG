services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-xrag
    ports:
      - "8000:8000"
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    command: [
      "--host", "0.0.0.0",
      "--port", "8000",
      "--model", "${VLLM_MODEL}",
      "--quantization", "${VLLM_QUANTIZATION}",
      "--max-model-len", "${VLLM_MAX_MODEL_LEN}",
      "--gpu-memory-utilization", "${VLLM_GPU_MEMORY_UTILIZATION}",
      "--hf-token", "${HF_TOKEN}",
      "--kv-cache-dtype","${KV_CACHE_DTYPE}",
      "--max-num-batched-tokens","${VLLM_MAX_BATCHED_TOKENS}",
      "--trust-remote-code",
      "--enable-prefix-caching",
      "--enable-auto-tool-choice",
      "--tool-call-parser", "hermes"

    ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1" ]
      interval: 60s
      timeout: 3s
      retries: 6

  open_webui:
    image: ghcr.io/open-webui/open-webui
    container_name: webui-xrag
    ports:
      - "8080:8080"
    environment:
      OPENAI_BASE_URL: http://vllm-xrag/v1:8000
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - vllm

  qdrant:
    image: qdrant/qdrant:latest
    env_file:
      - services/qdrant/.env
    container_name: qdrant-xrag
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - xrag-net

networks:
  xrag-net:
    name: xrag-net
    driver: bridge

volumes:
  open_webui_data:
  qdrant_storage:
